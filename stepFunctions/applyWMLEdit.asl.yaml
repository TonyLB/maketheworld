---
Comment: Command step-function to apply an edit to an asset file
StartAt: Define Defaults
States:
    "Define Defaults":
        Type: Pass
        Next: Apply Defaults
        ResultPath: "$.inputDefaults"
        Parameters:
            options:
                check: false
            message: "applyWMLEdit"
            connectionId: ""
            requestId: "none"
            player: ""
            tag: "Asset"
    "Apply Defaults":
        Type: Pass
        Next: Request Lock
        ResultPath: "$"
        Parameters:
            "args.$": "States.JsonMerge($.inputDefaults, $$.Execution.Input, false)"
    "Request Lock":
        Type: Task
        Resource: "${WMLFunctionArn}"
        Parameters:
            "message": "requestLock"
            "AssetId.$": "$.args.assetId"
        ResultPath: "$.lockResult"
        Next: Is Lock Secured
    "Is Lock Secured":
        Type: Choice
        Choices:
            -
                Variable: "$.lockResult.secured"
                BooleanEquals: true
                Next: Apply Edit
        Default: Check For Timeout
    "Check For Timeout":
        Type: Choice
        Choices:
            -
                Variable: "$.lockResult.timeoutCounter"
                NumericGreaterThan: 5
                Next: Timeout
        Default: Recheck Lock
    "Recheck Lock":
        Type: Task
        Resource: "${WMLFunctionArn}"
        Parameters:
            "message": "checkLock"
            "AssetId.$": "$.args.assetId"
            "lock.$": "$.lockResult.lock"
            "timeoutCounter.$": "$.lockResult.timeoutCounter"
        ResultPath: "$.lockResult"
        Next: Is Lock Secured
    "Apply Edit":
        Type: Task
        Next: Yield Lock
        Resource: "${WMLFunctionArn}"
        Parameters:
            "message": "applyEdit"
            "AssetId.$": "$.args.assetId"
            "RequestId.$": "$.args.requestId"
            "schema.$": "$.args.schema"
        Catch:
            -
                ErrorEquals:
                    - States.ALL
                Next: Notify of Failure
        ResultPath: "$.applyResults"
    "Yield Lock":
        Type: Task
        Resource: "${WMLFunctionArn}"
        Parameters:
            "message": "yieldLock"
            "AssetId.$": "$.args.assetId"
            "lock.$": "$.lockResult.lock"
        ResultPath: "$.lockResult"
        Next: Done
    "Timeout":
        Type: Task
        Next: Failure
        Resource: "arn:aws:states:::sns:publish"
        Parameters:
            TopicArn: "${TopicArn}"
            Message: "{}"
            MessageAttributes:
                Type:
                    DataType: String
                    StringValue: Error
                RequestId:
                    DataType: String
                    "StringValue.$": "$.args.requestId"
                Targets:
                    DataType: String.Array
                    "StringValue.$": "States.JsonToString(States.Array(States.Format('CONNECTION#{}', $.args.connectionId)))"
                Error:
                    DataType: String
                    StringValue: "Timeout"
    "Notify of Failure":
        Type: Task
        Next: Failure
        Resource: "arn:aws:states:::sns:publish"
        Parameters:
            TopicArn: "${TopicArn}"
            Message: "{}"
            MessageAttributes:
                Type:
                    DataType: String
                    StringValue: Error
                RequestId:
                    DataType: String
                    "StringValue.$": "$.args.requestId"
                Targets:
                    DataType: String.Array
                    "StringValue.$": "States.JsonToString(States.Array(States.Format('CONNECTION#{}', $.args.connectionId)))"
                Error:
                    DataType: String
                    StringValue: "Error while parsing WML"
    Failure:
        Type: Fail
    Done:
        Type: Succeed
