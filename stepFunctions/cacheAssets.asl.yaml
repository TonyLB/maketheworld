---
Comment: Command step-function to execute cache of assets into Ephemera storage
StartAt: Define Defaults
States:
    "Define Defaults":
        Type: Pass
        Next: Apply Defaults
        ResultPath: "$.inputDefaults"
        Parameters:
            connectionId: ""
            requestId: ""
    "Apply Defaults":
        Type: Pass
        Next: Check Options
        ResultPath: "$"
        Parameters:
            "args.$": "States.JsonMerge($.inputDefaults, $$.Execution.Input, false)"
    "Check Options":
        Type: Choice
        Choices:
            -
                Variable: "$.args.options"
                IsPresent: True
                Next: Cache All
        Default: Default options
    "Default options":
        Type: Pass
        Parameters:
            updateOnly: false
            check: false
        ResultPath: "$.args.options"
        Next: Cache All
    "Cache All":
        Type: Parallel
        Next: Done
        Branches:
            -
                StartAt: Cache Assets
                States:
                    "Cache Assets":
                        Type: Task
                        End: true
                        Resource: "${AssetsFunctionArn}"
                        Parameters:
                            "message": "cacheAsset"
                            "assetId.$": "$.args.assetIds[0]"
            -
                StartAt: Cache Ephemera
                States:
                    "Cache Ephemera":
                        Type: Task
                        End: true
                        Resource: "${EphemeraFunctionArn}"
                        Parameters:
                            "message": "cacheAssets"
                            "assetIds.$": "$.args.assetIds"
                            "options.$": "$.args.options"
        Catch:
            -
                ErrorEquals:
                    - States.ALL
                Next: Decache
        ResultPath: null
    Decache:
        Type: Task
        Next: Notify of Failure
        Resource: "${EphemeraFunctionArn}"
        Parameters:
            "message": "decacheAssets"
            "assetIds.$": "$.args.assetIds"
    "Notify of Failure":
        Type: Task
        Next: Failure
        Resource: "arn:aws:states:::sns:publish"
        Parameters:
            TopicArn: "${TopicArn}"
            Message: "{}"
            MessageAttributes:
                Type:
                    DataType: String
                    StringValue: Error
                RequestId:
                    DataType: String
                    "StringValue.$": "$.args.requestId"
                Targets:
                    DataType: String.Array
                    "StringValue.$": "States.JsonToString(States.Array(States.Format('CONNECTION#{}', $.args.connectionId)))"
                Error:
                    DataType: String
                    StringValue: "Error while caching assets"
    Failure:
        Type: Fail
    Done:
        Type: Succeed
