---
Comment: Command step-function to execute decache
StartAt: Decache All
States:
    "Decache All":
        Type: Parallel
        Next: Done
        Branches:
            -
                StartAt: Decache Assets
                States:
                    "Decache Assets":
                        Type: Task
                        End: true
                        Resource: "${AssetsFunctionArn}"
                        Parameters:
                            "message": "decacheAssets"
                            "assetId.$": "$.args.assetIds[0]"
            -
                StartAt: Decache Ephemera
                States:
                    "Decache Ephemera":
                        Type: Task
                        End: true
                        Resource: "${EphemeraFunctionArn}"
                        Parameters:
                            "message": "decacheAssets"
                            "assetIds.$": "$.assetIds"
        Retry:
            -
                ErrorEquals:
                    - States.TaskFailed
                IntervalSeconds: 2
                MaxAttempts: 3
                BackoffRate: 1
        ResultPath: null
    Done:
        Type: Succeed
