---
Comment: Command step-function to initiate a player heal
StartAt: Heal Player
States:
    "Heal Player":
        Type: Task
        Next: Parse Heal Player Body
        Resource: "${AssetsFunctionArn}"
        Parameters:
            type: "HealPlayer"
            player.$: "$$.Execution.Input.player"
        ResultPath: "$.healResults"
    "Parse Heal Player Body":
        Type: Pass
        Next: Create Supplemental Argument
        Parameters:
            "parsedBody.$": "States.StringToJson($.healResults.body)"
        ResultPath: "$.parsedHealResults"
    "Create Supplemental Argument":
        Type: Pass
        Next: Supplement Update Arguments
        Parameters:
            type: "Player"
            "player.$": "$$.Execution.Input.player"
        ResultPath: "$.supplement"
    "Supplement Update Arguments":
        Type: Pass
        Next: Update Ephemera
        Parameters:
            "updateArgs.$": "States.JsonMerge($.parsedHealResults.parsedBody, $.supplement, false)"
        ResultPath: "$"
    "Update Ephemera":
        Type: Task
        Next: Done
        InputPath: "$.updateArgs"
        Resource: "${UpdateEphemeraFunctionArn}"
    Done:
        Type: Succeed
